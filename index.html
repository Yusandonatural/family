<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かぞくのアプリ</title>
<meta name="theme-color" content="#ffb938">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/kozukai.css">
</head>
<body>

<!-- さいしょの 画面：だれが つかう？ -->
<section class="screen home" id="famHome">
  <h1 class="logo">かぞくの<b>アプリ</b></h1>
  <p class="lead">だれが つかう？</p>
  <div class="who" id="famWho"></div>
</section>

<!-- えらんだ 人の メニュー -->
<section class="screen" id="famMenu" hidden>
  <header class="topbar">
    <button class="icon-btn fam-back" aria-label="なまえを えらびなおす">←</button>
    <span class="me" id="famMe"></span>
    <span></span>
  </header>
  <p class="lead" id="famAsk">なにを する？</p>
  <div class="who fam-apps">
    <button class="who-btn" data-go="study">
      <span class="av">📚</span><span class="nm">まいにち30ぷん</span>
      <span class="st" id="famStudySt">えいご と さんすう</span>
    </button>
    <button class="who-btn" data-go="kozukai">
      <span class="av">🪙</span><span class="nm">おてつだい</span>
      <span class="st num" id="famKzSt">こづかい帳</span>
    </button>
    <button class="who-btn" data-go="uranai">
      <span class="av">🔮</span><span class="nm">きょうの うんせい</span>
      <span class="st" id="famUrSt">星命録</span>
    </button>
  </div>
</section>

<!-- まいにち30ぷん から ホームへ もどる バー -->
<div class="fam-bar" id="famBar" hidden>
  <button class="link fam-menu">← メニューへ</button>
</div>
<main id="app" aria-live="polite" hidden></main>

<!-- おてつだい こづかい帳 -->
<section class="screen" id="kz" hidden>
  <header class="topbar">
    <button class="icon-btn fam-menu" aria-label="メニューへ もどる">←</button>
    <h2>🪙 おてつだい こづかい帳</h2>
    <span></span>
  </header>
  <p class="kz-sync" id="kzSync" role="status">この 端末に 保存しています</p>

  <div class="kz-kids" id="kzKids" role="group" aria-label="だれの 記録を 見る？"></div>

  <div class="card cal kz-cal" id="kzCal"></div>

  <div class="card">
    <h2 id="kzDetailTitle">明細</h2>
    <p class="hint">おてつだいごとの 回数と 金額です。月末に この金額を しきゅうします。</p>
    <div class="kz-scroll"><table class="kt" id="kzDetail"></table></div>
  </div>

  <div class="card">
    <h2>おてつだいの しゅるい</h2>
    <p class="hint">名前と 金額を 変えたり、新しい おてつだいを 追加できます。金額を 変えても、もう 記録した 日の 金額は そのままです。</p>
    <div class="kz-list" id="kzChores"></div>
    <form class="kz-row" id="kzAddChore">
      <input class="kz-in" type="text" id="kzNewChore" placeholder="例：ゴミ出し" aria-label="おてつだいの 名前" required>
      <input class="kz-in price" type="number" id="kzNewPrice" min="0" step="10" value="10" aria-label="金額（円）" required>
      <span>円</span>
      <button class="btn sm primary" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>こども</h2>
    <div class="kz-list" id="kzKidList"></div>
    <form class="kz-row" id="kzAddKid">
      <input class="kz-in" type="text" id="kzNewKid" placeholder="名前" aria-label="こどもの 名前" required>
      <button class="btn sm primary" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>バックアップ</h2>
    <p class="hint" id="kzBackupHint">記録を ファイルに 書き出しておくと、万一のときに 読み込んで 元に もどせます。</p>
    <div class="kz-row wrap">
      <button class="btn sm ghost" id="kzExport" type="button">ファイルに 書き出す</button>
      <label class="btn sm ghost" for="kzImport">ファイルから 読み込む</label>
      <input type="file" id="kzImport" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="kzBackupMsg" role="status"></p>
  </div>
</section>

<!-- きょうの うんせい -->
<section class="screen" id="ur" hidden>
  <header class="topbar">
    <button class="icon-btn fam-menu" aria-label="メニューへ もどる">←</button>
    <h2>🔮 きょうの うんせい</h2>
    <span></span>
  </header>
  <p class="lead" id="urDate"></p>
  <div id="urBody" style="display:flex;flex-direction:column;gap:16px"></div>
  <p class="hint" style="text-align:center">星命録（四柱推命・動物占い・西洋占星術）の けいさんで 出しています。あそびとして たのしんでね。</p>
</section>

<div class="overlay kz-ov" id="kzSheet" hidden>
  <div class="ov-card" role="dialog" aria-modal="true" aria-labelledby="kzSheetTitle">
    <h2 id="kzSheetTitle"></h2>
    <div id="kzSheetBody" class="kz-list"></div>
    <button class="btn big primary" id="kzSheetClose">とじる</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
<script src="js/kozukai.js"></script>
<script src="js/uranai.js"></script>
<script>
/* さいしょに なまえを えらび、その人の メニューから 2つの アプリを ひらく
   画面は #menu / #study / #kozukai / #uranai で きりかえる（なにも ないときは なまえ えらび） */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const yen = (n) => n.toLocaleString('ja-JP');
  const PARENT = { id: 'all', name: 'おうちの人' };
  const study = $('app');
  const bar = $('famBar');
  // べんきょう中・ゲーム中・タイマーでは もどる バーを 出さない
  const BAR_SCREENS = ['home', 'dash', 'parent', 'report', 'pform'];
  let who = null;

  const avatar = (k, big) => {
    if (k.id === 'all') return `<span class="av">👪</span>`;
    const s = window.Study.find(k.name);
    return s ? `<span class="av">${s.avatar}</span>`
      : `<span class="av fam-init${big ? '' : ' sm'}" style="--kc:${k.color}">${esc(k.name.slice(0, 1))}</span>`;
  };

  function renderWho() {
    const kids = window.Kozukai.kids();
    $('famWho').innerHTML = kids.map((k) => {
      const s = window.Study.find(k.name);
      const st = s ? (s.cleared ? `✅ きょう レッスン ${s.lessons}かい` : `🔥 ${s.streak}にち れんぞく`) : `🪙 ${yen(k.month.sum)}円`;
      return `<button class="who-btn" data-who="${k.id}">${avatar(k, true)}<span class="nm">${esc(k.name)}</span><span class="st">${st}</span></button>`;
    }).join('') + `<button class="who-btn" data-who="all"><span class="av">👪</span><span class="nm">おうちの人</span><span class="st">みんなの きろく</span></button>`;
  }

  function renderMenu() {
    if (!who) return;
    const k = who.id === 'all' ? PARENT : window.Kozukai.kids().find((x) => x.id === who.id);
    if (!k) { who = null; return; }
    who = k;
    $('famMe').innerHTML = `${avatar(k)}<span><b>${esc(k.name)}</b></span>`;
    $('famAsk').textContent = k.id === 'all' ? 'どちらを ひらきますか？' : `${k.name}、なにを する？`;
    const m = window.Kozukai.month();
    if (k.id === 'all') {
      $('famStudySt').textContent = 'きろく・せってい';
      $('famKzSt').textContent = `${m}月 ごうけい ${yen(window.Kozukai.monthTotal().sum)}円`;
    } else {
      const s = window.Study.find(k.name);
      $('famStudySt').textContent = !s ? 'はじめて つかう' : s.cleared ? `✅ きょう レッスン ${s.lessons}かい` : 'きょうの レッスン まだ';
      $('famKzSt').textContent = `${m}月 ${yen(k.month.sum)}円`;
    }
    const f = k.id === 'all' ? null : window.Uranai.fortune(k.birth);
    $('famUrSt').innerHTML = k.id === 'all' ? 'みんなの うんせい'
      : f ? `<span class="ur-stars">${window.Uranai.stars(f.score)}</span>` : 'たんじょうびを いれてね';
  }

  // ---------- きょうの うんせい ----------
  const people = () => window.Kozukai.kids().concat(window.Kozukai.adults());
  const urAv = (k) => {
    const s = window.Study.find(k.name);
    return s ? `<span class="ur-av emoji">${s.avatar}</span>` : `<span class="ur-av" style="--kc:${k.color}">${esc(k.name.slice(0, 1))}</span>`;
  };
  const birthForm = (k, label) => `<div class="ur-birth" data-id="${k.id}">
      <input class="ur-in" type="date" id="ub-${k.id}" value="${k.birth || ''}" max="${new Date().toISOString().slice(0, 10)}" aria-label="${esc(k.name)}の たんじょうび">
      <button class="btn sm primary ur-save">${label}</button></div>`;

  function renderUranai() {
    const body = $('urBody');
    if (body.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
    const U = window.Uranai, info = U.todayInfo();
    $('urDate').innerHTML = `${info.label}・${info.kanshi}の日`;
    const lucky = `<div class="card ur-mini"><span class="lb">きょうの ラッキーカラー</span><span class="vl"><span class="ur-swatch" style="background:${info.lucky.hex}"></span>${info.lucky.ja}</span></div>`;

    if (who.id !== 'all') {
      const k = people().find((x) => x.id === who.id);
      const f = k && U.fortune(k.birth);
      if (!f) {
        body.innerHTML = `<div class="card ur-main">${urAv(k)}<h2>${esc(k.name)}の たんじょうびを おしえてね</h2>
          <p class="hint">たんじょうびから、きょうの うんせいと きみの どうぶつが わかるよ</p>${birthForm(k, 'とうろく')}</div>${lucky}`;
        return;
      }
      body.innerHTML = `
        <div class="card ur-main">${urAv(k)}<h2>${esc(k.name)}の きょうの うんせい</h2>
          <div class="ur-stars" role="img" aria-label="5つのうち${f.score}つ">${U.stars(f.score)}</div>
          <p class="msg">${f.msg}</p>
          ${f.notes.length ? `<div class="ur-notes">${f.notes.map((n) => `<span class="ur-note">${n}</span>`).join('')}</div>` : ''}
        </div>
        <div class="ur-grid">${lucky}
          <div class="card ur-mini"><span class="lb">こんしゅうの いちばん いい日</span><span class="vl">${U.dayLabel(f.best.date)} <span class="ur-stars">${U.stars(f.best.score)}</span></span></div>
        </div>
        <div class="card ur-animal"><span class="em">${f.emoji}</span><div><b>${esc(k.name)}は ${f.animal}</b> <small>${f.sign}</small><p>${f.animalText}</p></div></div>`;
      return;
    }

    // おうちの人：みんなの うんせいと たんじょうびの せってい
    const list = people().map((k) => ({ k, f: U.fortune(k.birth) }));
    const top = Math.max(0, ...list.filter((x) => x.f).map((x) => x.f.score));
    const rows = list.map(({ k, f }) => `<div class="ur-row">${urAv(k)}
        <span class="who"><b>${esc(k.name)}${f && f.score === top ? '<span class="top">しゅやく</span>' : ''}</b>
        <small>${f ? (f.notes[0] || f.msg) : 'たんじょうびが まだです'}</small></span>
        ${f ? `<span class="ur-stars">${U.stars(f.score)}</span>` : ''}</div>`).join('');
    const adults = window.Kozukai.adults();
    body.innerHTML = `
      <div class="card"><h2>みんなの きょうの うんせい</h2>${rows}</div>
      ${lucky}
      <div class="card"><h2>たんじょうびの せってい</h2>
        <p class="hint">うんせいは たんじょうびで けいさんします。おとなも 追加できます（こづかい帳には 出ません）。</p>
        ${people().map((k) => `<div class="ur-row">${urAv(k)}<span class="who"><b>${esc(k.name)}</b>${birthForm(k, 'ほぞん')}</span>
          ${adults.some((a) => a.id === k.id) ? `<button class="btn sm ghost ur-del" data-id="${k.id}">けす</button>` : ''}</div>`).join('')}
        <form class="kz-row wrap" id="urAddAdult" style="margin-top:12px">
          <input class="kz-in" type="text" id="urNewName" placeholder="おとなの 名前" aria-label="おとなの 名前" required style="flex-basis:100%">
          <input class="ur-in" type="date" id="urNewBirth" aria-label="たんじょうび" required>
          <button class="btn sm primary" type="submit">追加</button>
        </form>
      </div>`;
  }

  $('urBody').addEventListener('click', (e) => {
    const sv = e.target.closest('.ur-save');
    if (sv) {
      const box = sv.closest('.ur-birth'), v = box.querySelector('input').value;
      if (window.Uranai.parseBirth(v)) { document.activeElement.blur(); window.Kozukai.setBirth(box.dataset.id, v); renderUranai(); }
      return;
    }
    const del = e.target.closest('.ur-del');
    if (del) { window.Kozukai.removeAdult(del.dataset.id); renderUranai(); }
  });
  $('urBody').addEventListener('submit', (e) => {
    if (e.target.id !== 'urAddAdult') return;
    e.preventDefault();
    const name = $('urNewName').value.trim(), birth = $('urNewBirth').value;
    if (!name || !window.Uranai.parseBirth(birth)) return;
    document.activeElement.blur();
    window.Kozukai.addAdult(name, birth); renderUranai();
  });

  function updateBar() {
    bar.hidden = study.hidden || !BAR_SCREENS.includes(study.dataset.screen);
  }
  function route() {
    let r = location.hash.slice(1);
    if (r && !who) r = '';   // 読みこみ直した ときは なまえ えらびから
    $('famHome').hidden = r !== '';
    $('famMenu').hidden = r !== 'menu';
    study.hidden = r !== 'study';
    $('kz').hidden = r !== 'kozukai';
    $('ur').hidden = r !== 'uranai';
    if (r === '') renderWho();
    if (r === 'menu') renderMenu();
    if (r === 'uranai') renderUranai();
    updateBar();
    window.scrollTo(0, 0);
  }
  function go(r) {
    if (location.hash.slice(1) === r) return route();
    location.hash = r;
    route();
  }

  $('famWho').addEventListener('click', (e) => {
    const b = e.target.closest('[data-who]'); if (!b) return;
    who = { id: b.dataset.who };
    go('menu');
  });
  $('famMenu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    if (b.dataset.go === 'study') {
      if (who.id === 'all') window.Study.openHome(); else window.Study.open(who.name);
    } else if (b.dataset.go === 'kozukai') {
      window.Kozukai.setKid(who.id);
    }
    go(b.dataset.go);
  });
  document.querySelectorAll('.fam-back').forEach((b) => b.addEventListener('click', () => { who = null; go(''); }));
  document.querySelectorAll('.fam-menu').forEach((b) => b.addEventListener('click', () => go('menu')));
  window.addEventListener('hashchange', route);
  new MutationObserver(updateBar).observe(study, { attributes: true, attributeFilter: ['data-screen'] });

  // こづかい帳の なまえや 金額が かわったら（ほかの スマホからも）表示を なおす
  window.Kozukai.init({ onChange: () => { if (!$('famHome').hidden) renderWho(); if (!$('famMenu').hidden) renderMenu(); if (!$('ur').hidden) renderUranai(); } });
  route();
})();
</script>
</body>
</html>
