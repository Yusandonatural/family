<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かぞくのアプリ</title>
<meta name="theme-color" content="#ffb938">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/kozukai.css">
</head>
<body>

<!-- さいしょの 画面：だれが つかう？ -->
<section class="screen home" id="famHome">
  <h1 class="logo">かぞくの<b>アプリ</b></h1>
  <p class="lead">だれが つかう？</p>
  <div class="who" id="famWho"></div>
</section>

<!-- えらんだ 人の メニュー -->
<section class="screen" id="famMenu" hidden>
  <header class="topbar">
    <button class="icon-btn fam-back" aria-label="なまえを えらびなおす">←</button>
    <span class="me" id="famMe"></span>
    <span></span>
  </header>
  <p class="lead" id="famAsk">なにを する？</p>
  <div class="who fam-apps">
    <button class="who-btn" data-go="study">
      <span class="av">📚</span><span class="nm">まいにち30ぷん</span>
      <span class="st" id="famStudySt">えいご と さんすう</span>
    </button>
    <button class="who-btn" data-go="kozukai">
      <span class="av">🪙</span><span class="nm">おてつだい</span>
      <span class="st num" id="famKzSt">こづかい帳</span>
    </button>
  </div>
</section>

<!-- まいにち30ぷん から ホームへ もどる バー -->
<div class="fam-bar" id="famBar" hidden>
  <button class="link fam-menu">← メニューへ</button>
</div>
<main id="app" aria-live="polite" hidden></main>

<!-- おてつだい こづかい帳 -->
<section class="screen" id="kz" hidden>
  <header class="topbar">
    <button class="icon-btn fam-menu" aria-label="メニューへ もどる">←</button>
    <h2>🪙 おてつだい こづかい帳</h2>
    <span></span>
  </header>
  <p class="kz-sync" id="kzSync" role="status">この 端末に 保存しています</p>

  <div class="kz-kids" id="kzKids" role="group" aria-label="だれの 記録を 見る？"></div>

  <div class="card cal kz-cal" id="kzCal"></div>

  <div class="card">
    <h2 id="kzDetailTitle">明細</h2>
    <p class="hint">おてつだいごとの 回数と 金額です。月末に この金額を しきゅうします。</p>
    <div class="kz-scroll"><table class="kt" id="kzDetail"></table></div>
  </div>

  <div class="card">
    <h2>おてつだいの しゅるい</h2>
    <p class="hint">名前と 金額を 変えたり、新しい おてつだいを 追加できます。金額を 変えても、もう 記録した 日の 金額は そのままです。</p>
    <div class="kz-list" id="kzChores"></div>
    <form class="kz-row" id="kzAddChore">
      <input class="kz-in" type="text" id="kzNewChore" placeholder="例：ゴミ出し" aria-label="おてつだいの 名前" required>
      <input class="kz-in price" type="number" id="kzNewPrice" min="0" step="10" value="10" aria-label="金額（円）" required>
      <span>円</span>
      <button class="btn sm primary" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>こども</h2>
    <div class="kz-list" id="kzKidList"></div>
    <form class="kz-row" id="kzAddKid">
      <input class="kz-in" type="text" id="kzNewKid" placeholder="名前" aria-label="こどもの 名前" required>
      <button class="btn sm primary" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>バックアップ</h2>
    <p class="hint" id="kzBackupHint">記録を ファイルに 書き出しておくと、万一のときに 読み込んで 元に もどせます。</p>
    <div class="kz-row wrap">
      <button class="btn sm ghost" id="kzExport" type="button">ファイルに 書き出す</button>
      <label class="btn sm ghost" for="kzImport">ファイルから 読み込む</label>
      <input type="file" id="kzImport" accept="application/json,.json" hidden>
    </div>
    <p class="hint" id="kzBackupMsg" role="status"></p>
  </div>
</section>

<div class="overlay kz-ov" id="kzSheet" hidden>
  <div class="ov-card" role="dialog" aria-modal="true" aria-labelledby="kzSheetTitle">
    <h2 id="kzSheetTitle"></h2>
    <div id="kzSheetBody" class="kz-list"></div>
    <button class="btn big primary" id="kzSheetClose">とじる</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
<script src="js/kozukai.js"></script>
<script>
/* さいしょに なまえを えらび、その人の メニューから 2つの アプリを ひらく
   画面は #menu / #study / #kozukai で きりかえる（なにも ないときは なまえ えらび） */
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const yen = (n) => n.toLocaleString('ja-JP');
  const PARENT = { id: 'all', name: 'おうちの人' };
  const study = $('app');
  const bar = $('famBar');
  // べんきょう中・ゲーム中・タイマーでは もどる バーを 出さない
  const BAR_SCREENS = ['home', 'dash', 'parent', 'report', 'pform'];
  let who = null;

  const avatar = (k, big) => {
    if (k.id === 'all') return `<span class="av">👪</span>`;
    const s = window.Study.find(k.name);
    return s ? `<span class="av">${s.avatar}</span>`
      : `<span class="av fam-init${big ? '' : ' sm'}" style="--kc:${k.color}">${esc(k.name.slice(0, 1))}</span>`;
  };

  function renderWho() {
    const kids = window.Kozukai.kids();
    $('famWho').innerHTML = kids.map((k) => {
      const s = window.Study.find(k.name);
      const st = s ? (s.cleared ? `✅ きょう レッスン ${s.lessons}かい` : `🔥 ${s.streak}にち れんぞく`) : `🪙 ${yen(k.month.sum)}円`;
      return `<button class="who-btn" data-who="${k.id}">${avatar(k, true)}<span class="nm">${esc(k.name)}</span><span class="st">${st}</span></button>`;
    }).join('') + `<button class="who-btn" data-who="all"><span class="av">👪</span><span class="nm">おうちの人</span><span class="st">みんなの きろく</span></button>`;
  }

  function renderMenu() {
    if (!who) return;
    const k = who.id === 'all' ? PARENT : window.Kozukai.kids().find((x) => x.id === who.id);
    if (!k) { who = null; return; }
    who = k;
    $('famMe').innerHTML = `${avatar(k)}<span><b>${esc(k.name)}</b></span>`;
    $('famAsk').textContent = k.id === 'all' ? 'どちらを ひらきますか？' : `${k.name}、なにを する？`;
    const m = window.Kozukai.month();
    if (k.id === 'all') {
      $('famStudySt').textContent = 'きろく・せってい';
      $('famKzSt').textContent = `${m}月 ごうけい ${yen(window.Kozukai.monthTotal().sum)}円`;
    } else {
      const s = window.Study.find(k.name);
      $('famStudySt').textContent = !s ? 'はじめて つかう' : s.cleared ? `✅ きょう レッスン ${s.lessons}かい` : 'きょうの レッスン まだ';
      $('famKzSt').textContent = `${m}月 ${yen(k.month.sum)}円`;
    }
  }

  function updateBar() {
    bar.hidden = study.hidden || !BAR_SCREENS.includes(study.dataset.screen);
  }
  function route() {
    let r = location.hash.slice(1);
    if (r && !who) r = '';   // 読みこみ直した ときは なまえ えらびから
    $('famHome').hidden = r !== '';
    $('famMenu').hidden = r !== 'menu';
    study.hidden = r !== 'study';
    $('kz').hidden = r !== 'kozukai';
    if (r === '') renderWho();
    if (r === 'menu') renderMenu();
    updateBar();
    window.scrollTo(0, 0);
  }
  function go(r) {
    if (location.hash.slice(1) === r) return route();
    location.hash = r;
    route();
  }

  $('famWho').addEventListener('click', (e) => {
    const b = e.target.closest('[data-who]'); if (!b) return;
    who = { id: b.dataset.who };
    go('menu');
  });
  $('famMenu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]'); if (!b) return;
    if (b.dataset.go === 'study') {
      if (who.id === 'all') window.Study.openHome(); else window.Study.open(who.name);
    } else {
      window.Kozukai.setKid(who.id);
    }
    go(b.dataset.go);
  });
  document.querySelectorAll('.fam-back').forEach((b) => b.addEventListener('click', () => { who = null; go(''); }));
  document.querySelectorAll('.fam-menu').forEach((b) => b.addEventListener('click', () => go('menu')));
  window.addEventListener('hashchange', route);
  new MutationObserver(updateBar).observe(study, { attributes: true, attributeFilter: ['data-screen'] });

  // こづかい帳の なまえや 金額が かわったら（ほかの スマホからも）表示を なおす
  window.Kozukai.init({ onChange: () => { if (!$('famHome').hidden) renderWho(); if (!$('famMenu').hidden) renderMenu(); } });
  route();
})();
</script>
</body>
</html>
